# Local end-to-end fixture. Management key: test-management-key. Client key: test-client-key.
config-version: 8
server:
    host: "127.0.0.1"
    port: 18317
management:
    allow-remote: false
    secret-key: "test-management-key"
access:
    api-keys:
        - "test-client-key"
plugins:
    enabled: true
    dir: "plugins"
    configs:
        relaywarden:
            enabled: true
            priority: 10
            compression:
                enabled: true
                shadow: true
                min_bytes: 100
                tail_only: true
            guard:
                enabled: true
            routing:
                enabled: true
                strategy: "latency_cache"
            ui:
                enabled: true
api-keys:
    openai-compatibility:
        - name: "mock"
          base-url: "http://127.0.0.1:19000/v1"
          keys:
            - api-key: "mock-key"
          models:
            - name: "gpt-4o"
              alias: "mock-gpt"
