name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_ID: relaywarden

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Build management UI
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  # The plugin store requires prebuilt binaries for all five targets, so each
  # one builds natively on a matching runner instead of cross-compiling cgo.
  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            ext: so
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            ext: so
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            ext: dylib
          - runner: macos-15
            goos: darwin
            goarch: arm64
            ext: dylib
          - runner: windows-2025
            goos: windows
            goarch: amd64
            ext: dll
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw --no-progress -y
      - name: Resolve release metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "LIB_NAME=${PLUGIN_ID}.${{ matrix.ext }}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"
      - name: Build shared library
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildmode=c-shared -o "dist/${LIB_NAME}" .
          # c-shared also emits a C header; it is not a release artifact.
          rm -f "dist/${PLUGIN_ID}.h"
      # The store installs from a per-platform zip holding the dynamic library
      # at its root, named <id>.<ext>.
      - name: Package archive
        run: |
          set -euo pipefail
          cd dist
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${LIB_NAME}' -DestinationPath '${ARCHIVE_NAME}' -Force"
          else
            zip -j "${ARCHIVE_NAME}" "${LIB_NAME}"
          fi
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    # workflow_dispatch is for rebuilding artifacts against an existing tag.
    # A dispatch on a branch must not create a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
