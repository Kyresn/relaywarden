name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Build management UI
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: so
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: dylib
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw --no-progress -y
      - name: Build shared library
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -buildmode=c-shared -o "dist/relaywarden.${{ matrix.ext }}" .
          # c-shared also emits a C header; it is not a release artifact.
          rm -f dist/relaywarden.h
      # The plugin store installs from a per-platform zip that holds the
      # dynamic library at its root, named <id>.<ext>.
      - name: Package zip (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd dist
          zip -j "relaywarden_${version}_${GOOS}_${GOARCH}.zip" "relaywarden.${EXT}"
      - name: Package zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          $version = $env:REF_NAME.TrimStart("v")
          $name = "relaywarden_{0}_{1}_{2}.zip" -f $version, $env:GOOS, $env:GOARCH
          Compress-Archive -Path "dist/relaywarden.dll" -DestinationPath "dist/$name" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: relaywarden-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    # workflow_dispatch is for rebuilding artifacts against an existing tag.
    # A dispatch on a branch must not create a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: relaywarden-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
