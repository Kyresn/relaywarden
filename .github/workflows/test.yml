name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Build management UI
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build shared library
        run: CGO_ENABLED=1 go build -buildmode=c-shared -o /tmp/relaywarden.so .
